<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1000" height="700" fill="#ffffff" stroke="#333" stroke-width="2"/>

  <text x="500" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">WIREFRAME: Login &amp; OTP Verification</text>

  <!-- Navbar -->
  <rect x="20" y="50" width="960" height="50" fill="#e8e8e8" stroke="#999" stroke-width="1.5"/>
  <text x="40" y="80" font-size="12" fill="#555">EduStream LOGO</text>

  <!-- LEFT: Login card -->
  <text x="260" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">1. Login / Register</text>
  <rect x="80" y="145" width="360" height="440" fill="#f7f7f7" stroke="#999" stroke-width="1.5"/>
  <text x="260" y="180" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">Sign In</text>

  <text x="105" y="215" font-size="10" fill="#555">Email Address</text>
  <rect x="105" y="222" width="310" height="30" fill="#fff" stroke="#999"/>

  <text x="105" y="270" font-size="10" fill="#555">Password</text>
  <rect x="105" y="277" width="310" height="30" fill="#fff" stroke="#999"/>

  <rect x="105" y="325" width="310" height="34" fill="#bcd6ea" stroke="#999"/>
  <text x="260" y="346" text-anchor="middle" font-size="11" fill="#333">Login</text>

  <text x="260" y="385" text-anchor="middle" font-size="9" fill="#999">— or —</text>

  <rect x="105" y="400" width="145" height="30" fill="#e6e6fa" stroke="#999"/>
  <text x="177" y="419" text-anchor="middle" font-size="9" fill="#555">Demo: Admin</text>
  <rect x="270" y="400" width="145" height="30" fill="#e6e6fa" stroke="#999"/>
  <text x="342" y="419" text-anchor="middle" font-size="9" fill="#555">Demo: Student</text>

  <line x1="105" y1="450" x2="415" y2="450" stroke="#ccc"/>

  <text x="260" y="475" text-anchor="middle" font-size="10" fill="#555">New here? Register:</text>
  <rect x="105" y="485" width="310" height="28" fill="#fff" stroke="#999"/>
  <text x="115" y="503" font-size="9" fill="#999">Full Name</text>
  <rect x="105" y="518" width="310" height="28" fill="#fff" stroke="#999"/>
  <text x="115" y="536" font-size="9" fill="#999">Email</text>
  <rect x="105" y="551" width="310" height="28" fill="#fff" stroke="#999"/>
  <text x="115" y="569" font-size="9" fill="#999">Password</text>

  <!-- Arrow -->
  <path d="M 450 365 L 510 365" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>

  <!-- RIGHT: OTP verification card -->
  <text x="740" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">2. OTP Verification</text>
  <rect x="560" y="145" width="360" height="300" fill="#f7f7f7" stroke="#999" stroke-width="1.5"/>
  <text x="740" y="180" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">Verify Your Email</text>
  <text x="740" y="200" text-anchor="middle" font-size="9" fill="#777">Enter the 6-digit code sent to your email</text>

  <!-- OTP boxes -->
  <g stroke="#999" fill="#fff">
    <rect x="600" y="220" width="40" height="45"/>
    <rect x="650" y="220" width="40" height="45"/>
    <rect x="700" y="220" width="40" height="45"/>
    <rect x="750" y="220" width="40" height="45"/>
    <rect x="800" y="220" width="40" height="45"/>
    <rect x="850" y="220" width="40" height="45"/>
  </g>
  <g font-size="14" fill="#333" text-anchor="middle">
    <text x="620" y="248">•</text>
    <text x="670" y="248">•</text>
    <text x="720" y="248">•</text>
    <text x="770" y="248">•</text>
    <text x="820" y="248">•</text>
    <text x="870" y="248">•</text>
  </g>

  <rect x="600" y="285" width="290" height="34" fill="#bcd6ea" stroke="#999"/>
  <text x="745" y="306" text-anchor="middle" font-size="11" fill="#333">Verify &amp; Activate Account</text>

  <text x="745" y="340" text-anchor="middle" font-size="9" fill="#3366cc">Resend Code (expires in 10 min)</text>

  <!-- Simulated inbox box -->
  <rect x="560" y="465" width="360" height="120" fill="#fff9e6" stroke="#e0c060" stroke-width="1.5" stroke-dasharray="4"/>
  <text x="740" y="490" text-anchor="middle" font-size="10" font-weight="bold" fill="#775500">📧 Simulated Email Preview</text>
  <text x="740" y="510" text-anchor="middle" font-size="9" fill="#775500">(no real SMTP — OTP shown on-screen for demo)</text>
  <text x="740" y="535" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">482913</text>
  <text x="740" y="555" text-anchor="middle" font-size="8" fill="#999">Expires in 10:00</text>

  <!-- Footer -->
  <rect x="20" y="655" width="960" height="30" fill="#e8e8e8" stroke="#999"/>
</svg>
