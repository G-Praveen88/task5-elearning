<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1000" height="700" fill="#ffffff" stroke="#333" stroke-width="2"/>

  <text x="500" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">WIREFRAME: Admin / Instructor Dashboard</text>

  <!-- Top bar -->
  <rect x="20" y="50" width="960" height="45" fill="#333" stroke="#000"/>
  <text x="40" y="77" font-size="12" fill="#fff">🎓 EduStream Admin</text>
  <text x="900" y="77" text-anchor="end" font-size="10" fill="#ccc">Admin ▾ | Logout</text>

  <!-- Sidebar -->
  <rect x="20" y="95" width="170" height="560" fill="#f0f0f0" stroke="#999"/>
  <g font-size="10" fill="#555">
    <rect x="32" y="112" width="146" height="28" fill="#dceedc" stroke="#999"/>
    <text x="105" y="130" text-anchor="middle">📊 Dashboard</text>
    <rect x="32" y="148" width="146" height="28" fill="#fff" stroke="#999"/>
    <text x="105" y="166" text-anchor="middle">📚 Courses</text>
    <rect x="32" y="184" width="146" height="28" fill="#fff" stroke="#999"/>
    <text x="105" y="202" text-anchor="middle">🎬 Lessons</text>
    <rect x="32" y="220" width="146" height="28" fill="#fff" stroke="#999"/>
    <text x="105" y="238" text-anchor="middle">🧑‍🎓 Students</text>
    <rect x="32" y="256" width="146" height="28" fill="#fff" stroke="#999"/>
    <text x="105" y="274" text-anchor="middle">📈 Analytics</text>
  </g>

  <!-- KPI cards (5 widgets) -->
  <text x="210" y="120" font-size="13" font-weight="bold" fill="#333">Executive Overview</text>
  <g stroke="#999" fill="#f7f7f7">
    <rect x="210" y="135" width="145" height="75"/>
    <rect x="365" y="135" width="145" height="75"/>
    <rect x="520" y="135" width="145" height="75"/>
    <rect x="675" y="135" width="145" height="75"/>
    <rect x="830" y="135" width="130" height="75"/>
  </g>
  <g font-size="9" fill="#777">
    <text x="282" y="160" text-anchor="middle">Total Students</text>
    <text x="282" y="185" text-anchor="middle" font-size="15" fill="#333">1,240</text>
    <text x="437" y="160" text-anchor="middle">Total Courses</text>
    <text x="437" y="185" text-anchor="middle" font-size="15" fill="#333">85</text>
    <text x="592" y="160" text-anchor="middle">Enrollments</text>
    <text x="592" y="185" text-anchor="middle" font-size="15" fill="#333">3,410</text>
    <text x="747" y="160" text-anchor="middle">7-Day Growth</text>
    <text x="747" y="185" text-anchor="middle" font-size="15" fill="#2a8">+12%</text>
    <text x="895" y="160" text-anchor="middle">Revenue</text>
    <text x="895" y="185" text-anchor="middle" font-size="15" fill="#333">$18.4k</text>
  </g>

  <!-- Charts row -->
  <text x="210" y="240" font-size="12" font-weight="bold" fill="#333">Daily Enrollment Trend (14 days)</text>
  <rect x="210" y="250" width="360" height="150" fill="#f7f7f7" stroke="#999"/>
  <polyline points="225,370 260,350 295,360 330,320 365,335 400,300 435,310 470,280 505,290 540,260"
            fill="none" stroke="#3366cc" stroke-width="2"/>
  <text x="390" y="410" text-anchor="middle" font-size="8" fill="#777">[Line Chart]</text>

  <text x="600" y="240" font-size="12" font-weight="bold" fill="#333">Category Share</text>
  <rect x="600" y="250" width="180" height="150" fill="#f7f7f7" stroke="#999"/>
  <circle cx="690" cy="325" r="55" fill="none" stroke="#3366cc" stroke-width="18" stroke-dasharray="80 190"/>
  <circle cx="690" cy="325" r="55" fill="none" stroke="#5cb85c" stroke-width="18" stroke-dasharray="60 190" stroke-dashoffset="-80"/>
  <circle cx="690" cy="325" r="55" fill="none" stroke="#e0a020" stroke-width="18" stroke-dasharray="115 190" stroke-dashoffset="-140"/>
  <text x="690" y="410" text-anchor="middle" font-size="8" fill="#777">[Doughnut Chart]</text>

  <text x="800" y="240" font-size="12" font-weight="bold" fill="#333">Popular Courses</text>
  <rect x="800" y="250" width="160" height="150" fill="#f7f7f7" stroke="#999"/>
  <g fill="#3366cc">
    <rect x="815" y="365" width="20" height="25"/>
    <rect x="845" y="340" width="20" height="50"/>
    <rect x="875" y="320" width="20" height="70"/>
    <rect x="905" y="355" width="20" height="35"/>
  </g>
  <text x="880" y="410" text-anchor="middle" font-size="8" fill="#777">[Bar Chart]</text>

  <!-- Course table preview -->
  <text x="210" y="440" font-size="12" font-weight="bold" fill="#333">Manage Courses</text>
  <rect x="210" y="450" width="750" height="150" fill="#f7f7f7" stroke="#999"/>
  <g font-size="9" fill="#666">
    <line x1="210" y1="475" x2="960" y2="475" stroke="#ccc"/>
    <text x="225" y="470">Thumbnail</text>
    <text x="340" y="470">Title</text>
    <text x="520" y="470">Category</text>
    <text x="620" y="470">Price</text>
    <text x="700" y="470">Instructor</text>
    <text x="820" y="470">Actions</text>
    <rect x="825" y="485" width="45" height="20" fill="#dceedc" stroke="#999"/>
    <text x="847" y="499" text-anchor="middle">Edit</text>
    <rect x="880" y="485" width="55" height="20" fill="#f5d5d5" stroke="#999"/>
    <text x="907" y="499" text-anchor="middle">Delete</text>
  </g>
  <rect x="225" y="560" width="110" height="26" fill="#bcd6ea" stroke="#999"/>
  <text x="280" y="577" text-anchor="middle" font-size="10" fill="#333">+ Add Course</text>

  <!-- Footer -->
  <rect x="20" y="655" width="960" height="15" fill="#e8e8e8" stroke="#999"/>
</svg>
