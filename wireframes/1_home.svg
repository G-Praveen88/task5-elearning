<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1000" height="700" fill="#ffffff" stroke="#333" stroke-width="2"/>

  <text x="500" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">WIREFRAME: Home Page (EduStream LMS)</text>

  <!-- Navbar -->
  <rect x="20" y="50" width="960" height="55" fill="#e8e8e8" stroke="#999" stroke-width="1.5"/>
  <rect x="35" y="63" width="130" height="28" fill="#cfcfcf" stroke="#999"/>
  <text x="100" y="82" text-anchor="middle" font-size="11" fill="#555">EduStream LOGO</text>
  <rect x="450" y="63" width="90" height="28" fill="#cfcfcf" stroke="#999"/>
  <text x="495" y="82" text-anchor="middle" font-size="10" fill="#555">Courses</text>
  <rect x="810" y="63" width="150" height="28" fill="#cfcfcf" stroke="#999"/>
  <text x="885" y="82" text-anchor="middle" font-size="10" fill="#555">Login | Register</text>

  <!-- Hero with stats -->
  <rect x="20" y="115" width="960" height="150" fill="#d9e8f5" stroke="#999" stroke-width="1.5"/>
  <text x="500" y="160" text-anchor="middle" font-size="20" fill="#555">"Learn Without Limits"</text>
  <text x="500" y="182" text-anchor="middle" font-size="12" fill="#777">Platform tagline + CTA</text>
  <rect x="430" y="195" width="140" height="30" fill="#bcd6ea" stroke="#999"/>
  <text x="500" y="215" text-anchor="middle" font-size="11" fill="#555">Browse Courses</text>

  <!-- Live stats row -->
  <g stroke="#999" fill="#f7f7f7">
    <rect x="60" y="235" width="200" height="20"/>
    <rect x="290" y="235" width="200" height="20"/>
    <rect x="520" y="235" width="200" height="20"/>
    <rect x="750" y="235" width="180" height="20"/>
  </g>
  <g font-size="9" fill="#777">
    <text x="160" y="249" text-anchor="middle">1,200+ Students</text>
    <text x="390" y="249" text-anchor="middle">85 Courses</text>
    <text x="620" y="249" text-anchor="middle">30 Instructors</text>
    <text x="840" y="249" text-anchor="middle">4.8★ Rating</text>
  </g>

  <!-- Category cards -->
  <text x="30" y="300" font-size="13" font-weight="bold" fill="#333">Explore Categories</text>
  <g stroke="#999" fill="#f0f0f0">
    <rect x="30" y="315" width="220" height="80"/>
    <rect x="270" y="315" width="220" height="80"/>
    <rect x="510" y="315" width="220" height="80"/>
    <rect x="750" y="315" width="220" height="80"/>
  </g>
  <g font-size="11" fill="#555">
    <text x="140" y="360" text-anchor="middle">Programming</text>
    <text x="380" y="360" text-anchor="middle">Design</text>
    <text x="620" y="360" text-anchor="middle">Business</text>
    <text x="860" y="360" text-anchor="middle">Data Science</text>
  </g>

  <!-- Featured courses -->
  <text x="30" y="430" font-size="13" font-weight="bold" fill="#333">Featured Courses</text>
  <g stroke="#999" fill="#f7f7f7">
    <rect x="30" y="445" width="220" height="190"/>
    <rect x="270" y="445" width="220" height="190"/>
    <rect x="510" y="445" width="220" height="190"/>
    <rect x="750" y="445" width="220" height="190"/>
  </g>
  <g font-size="10" fill="#777">
    <text x="140" y="530" text-anchor="middle">[thumbnail]</text>
    <text x="140" y="590" text-anchor="middle">Course Title</text>
    <text x="140" y="605" text-anchor="middle">Instructor · $Price</text>
    <rect x="90" y="612" width="100" height="20" fill="#dceedc" stroke="#999"/>
    <text x="140" y="626" text-anchor="middle">View Course</text>

    <text x="380" y="530" text-anchor="middle">[thumbnail]</text>
    <text x="380" y="590" text-anchor="middle">Course Title</text>
    <text x="380" y="605" text-anchor="middle">Instructor · $Price</text>
    <rect x="330" y="612" width="100" height="20" fill="#dceedc" stroke="#999"/>
    <text x="380" y="626" text-anchor="middle">View Course</text>

    <text x="620" y="530" text-anchor="middle">[thumbnail]</text>
    <text x="620" y="590" text-anchor="middle">Course Title</text>
    <text x="620" y="605" text-anchor="middle">Instructor · $Price</text>
    <rect x="570" y="612" width="100" height="20" fill="#dceedc" stroke="#999"/>
    <text x="620" y="626" text-anchor="middle">View Course</text>

    <text x="860" y="530" text-anchor="middle">[thumbnail]</text>
    <text x="860" y="590" text-anchor="middle">Course Title</text>
    <text x="860" y="605" text-anchor="middle">Instructor · $Price</text>
    <rect x="810" y="612" width="100" height="20" fill="#dceedc" stroke="#999"/>
    <text x="860" y="626" text-anchor="middle">View Course</text>
  </g>

  <!-- Footer -->
  <rect x="20" y="655" width="960" height="30" fill="#e8e8e8" stroke="#999"/>
</svg>
